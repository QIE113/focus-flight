name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: |
          set +e
          gradle assembleDebug --no-daemon > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            {
              echo "### 编译错误";
              echo '```';
              grep -E "^e: " build.log | head -80;
              echo '```';
            } >> "$GITHUB_STEP_SUMMARY"
            exit $code
          fi

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/focus-flight-v1.6.1-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: focus-flight-v1.6.1-debug
          path: out/focus-flight-v1.6.1-debug.apk

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.6.1
          name: 专注飞行 v1.6.1 · 真地图 + 推镜头进机场
          body: |
            v1.6.1 —— 修掉上一版没落地的改动，并对着视频重做飞行页。

            bug
            · 上一版推镜头变量算了没接相机，进飞行页直接 zoom 14.6。
              现在真接上了：4.0 → 16.0 用 1600ms 推到出发机场，停 1000ms，
              再用 15600ms 匀速拉到 2.0。镜头中心前 1.6 秒钉在机场，之后交给航程点。

            底图
            · 换高德矢量瓦片（webrd），中文 POI 回来：杭州萧山国际机场、萧山区、钱塘江、太湖、G2504
            · 高德是 GCJ-02，补了 WGS-84 → GCJ-02 转换，否则 z15 整体偏三四百米
            · 右侧「▤」可在 高德矢量 / 高德卫星 之间切，署名跟着变
            · 瓦片源加了 dim 压暗参数（0–0.95），供暗色页面复用

            飞行页 HUD 按视频重做
            · 删掉顶部城市条、46sp 中央计时器、底部进度卡
            · 左三圆钮（暂停 / 飞机 / 返回）+ 右三圆钮（定位实心 / 图层 / 书签）
            · 底部两栏：剩余飞行时间 / 剩余飞行距离；7sp 署名常驻两角
            · 起终点改成黄色圆角方块 + 白色飞机剪影

            舱门页
            · 背景换成压暗的卫星图 + 150 颗星点 + 径向暗角，不再是纯黑
            · 顶部改成起落架图标 + 短横线

            数据
            · 加入特罗姆瑟 TOS（69.6833N 18.9189E），默认航线改为 HGH → TOS

            已知没做完（见 差异对照表-v1.7.md 第四节 P1）
            · 搜索页、座位图机身轮廓、登机牌深色卡面 + 点阵水印、撕票终点
          files: out/focus-flight-v1.6.1-debug.apk

      - name: Keep build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
