name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "focus-flight-v1.2.0-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: focus-flight-debug-apk
          path: focus-flight-v1.2.0-debug.apk
          if-no-files-found: error

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          name: 专注飞行 v1.2.0 · 撕票 + 自由缩放地图
          body: |
            撕票改成真的「划一点撕一点」：按住右侧票根往右拖，纸边跟着手指一点点裂开，
            还有震动反馈，撕到 80% 才起飞。
            地图换成自带世界陆地轮廓的球面地图，双指 1×~16× 自由缩放、单指拖动旋转，
            飞行时飞机沿大圆航线前进。
            依旧 Kotlin + Jetpack Compose 原生实现，无网络权限，全部离线。
          files: focus-flight-v1.2.0-debug.apk
