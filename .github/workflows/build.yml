name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: |
          set +e
          gradle assembleDebug --no-daemon > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            {
              echo "### 编译错误";
              echo '```';
              grep -E "^e: " build.log | head -80;
              echo '```';
            } >> "$GITHUB_STEP_SUMMARY"
            exit $code
          fi

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/focus-flight-v1.4.1-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: focus-flight-v1.4.1-debug
          path: out/focus-flight-v1.4.1-debug.apk

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.1
          name: 专注飞行 v1.4.1 · 把地球的卡彻底修掉
          body: |
            v1.4.0 的地球「能跑」，但不够顺。这一版只修流畅度，视觉不变。

            三个真问题：
            · 旋转是按整数贴图列取模的（1024 分度），每秒实际只更新 5 次，所以看着一顿一顿
            · 预计算在进入页面时同步跑在主线程，每个像素两次三角函数，会白卡上百毫秒
            · 逐帧渲染也在主线程，每次重画都会挤掉一帧

            改法：
            · 贴图横向放大 4 倍到 4096 分度，旋转步进降到屏幕 0.35 像素，肉眼连续
            · 预计算整体挪到 Dispatchers.Default，主线程不再有一次性卡顿
            · 逐帧渲染也挪到后台线程，主线程只负责 drawImage，再也不挤帧
            · 三缓冲 + 缓存的辉光画笔，不再每帧新建 shader
            · 场景卡片的点击补上按压缩放（之前漏了这 5 个格子）

            仍然全程离线、无网络权限、无 API Key。
          files: out/focus-flight-v1.4.1-debug.apk

      - name: Keep build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log