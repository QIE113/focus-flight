name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: |
          set +e
          gradle assembleDebug --no-daemon > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            {
              echo "### 编译错误";
              echo '```';
              grep -E "^e: " build.log | head -80;
              echo '```';
            } >> "$GITHUB_STEP_SUMMARY"
            exit $code
          fi

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/focus-flight-v1.5.0-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: focus-flight-v1.5.0-debug
          path: out/focus-flight-v1.5.0-debug.apk

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.5.0
          name: 专注飞行 v1.5.0 · 真地图 + 推镜头进机场
          body: |
            这一版把「自绘地球」换成了真实地图相机，对着参考视频逐段重做。

            地图
            · 接入真实瓦片（Esri 卫星 / CARTO 暗色），免 key，无 API Key、无地图 SDK
            · 自写墨卡托相机 + 瓦片金字塔：父瓦片顶位、当前级到货后交叉替换，推镜头全程不黑屏不跳格
            · 内存 LRU 26MB + 磁盘缓存，按需拉当前视口，不做预取、不打包瓦片
            · 断网自动回落到本地经纬网底图，计时、记录、统计完全不受影响
            · 地图左下常驻版权署名（授权要求）

            推镜头（对齐视频 21–25 秒）
            · 出发机场为中心，zoom 3.4 → 14.6，2600ms，CubicBezier(0.22, 0.61, 0.36, 1)
            · 推到机场能看清跑道，再随时间缓慢拉远看全程
            · HUD 在推镜头过半后淡入

            新流程（对齐视频 18–20 秒）
            · 撕票后进入「舱门关闭，飞行即将开始」黑场，点「出发！」才进客舱

            撕票（对齐视频 14–16 秒）
            · 票根改为在登机牌底部，向左脱出 + 逆时针旋转 + 下坠淡出
            · 拖动跟手，30% 阈值触发震动，松手 180ms 脱出 + 640ms 下坠，无弹簧无回弹

            动效节奏
            · 进场 380ms、卡片弹入、按压回弹统一，去掉超过 400ms 的拖沓淡入

            权限
            · 新增 INTERNET / ACCESS_NETWORK_STATE，仅用于拉地图瓦片
            · 计时与数据完全本地，飞行中不产生任何后台网络请求
          files: out/focus-flight-v1.5.0-debug.apk

      - name: Keep build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
