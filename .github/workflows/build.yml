name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "focus-flight-v1.1.0-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: focus-flight-debug-apk
          path: focus-flight-v1.1.0-debug.apk
          if-no-files-found: error

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: 专注飞行 v1.1.0 · 撕票登机版
          body: |
            点「开始旅程」先选从哪到哪，时长按真实大圆距离自动算好（巡航 840 km/h + 起降 26 分钟），
            再向右撕开登机牌票根才真正起飞。
            Kotlin + Jetpack Compose 原生实现，无网络权限，数据全部本地。
          files: focus-flight-v1.1.0-debug.apk
