name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: |
          set +e
          gradle assembleDebug --no-daemon > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            {
              echo "### 编译错误";
              echo '```';
              grep -E "^e: " build.log | head -80;
              echo '```';
            } >> "$GITHUB_STEP_SUMMARY"
            exit $code
          fi

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/focus-flight-v1.6.2-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: focus-flight-v1.6.2-debug
          path: out/focus-flight-v1.6.2-debug.apk

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.6.2
          name: 专注飞行 v1.6.2 · 真地图 + 推镜头进机场
          body: |
            v1.6.2 —— 自测发现的两个真 bug，加上按视频重做的搜索页。

            自测抓到的 bug（不是猜的，是实拉瓦片量出来的）
            · 推镜头终点原为 z2，但高德 z2 返回纯白空瓦片（实测 1 种颜色），
              动画最后一帧会整屏刷白。终点改为 z3（实测 57 种颜色，有内容）。
              16.0 → 3.0 匀速，13 个级别摊到 15600ms。
            · 高德矢量 maxZoom 原为 18，实测 z18 同样是空图，收到 17。

            搜索页（对齐视频 0–4s）
            · 暗色世界底图 + 搜索框放在屏高 32% 处，不再是顶部标题栏
            · 结果卡与搜索框上沿重叠 14dp，卡顶是黄色 ✈ TOS 徽章
            · 拼音前缀匹配：teluomu → 特罗姆瑟；打到 telu 不匹配，按视频保持空态
            · 空态是居中浅灰胶囊「没有可选的航班」，宽 66% 屏宽
            · 白胶囊「选择这趟航班」在卡片下方，点了写回航线并进选座
            · 顶栏 ‹ / ⚠（记录·趋势·世界）/ ⇄（交换起降）/ 白色 ⌕ 搜索胶囊

            已知仍未做（见 差异对照表-v1.7.md 第四节 P1）
            · 座位图机身轮廓、选座底部浮卡
            · 登机牌深色卡面 + 点阵水印 + 独立白底条码卡、撕票终点
            · 特罗姆瑟一带高德无数据（实测 z12 只有 1 种颜色），目的地附近是空白
          files: out/focus-flight-v1.6.2-debug.apk

      - name: Keep build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
