name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "focus-flight-v1.3.0-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: focus-flight-debug-apk
          path: focus-flight-v1.3.0-debug.apk
          if-no-files-found: error

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.0
          name: 专注飞行 v1.3.0 · 照着视频重做全流程
          body: |
            看完那条抖音之后的改版：
            · 流程对齐视频：选座（A/C/D/F × 01-10）→ 选专注场景 → 登机牌 → 舱门关闭「出发！」→ 飞行
            · 登机牌改成视频里的样子：深色半透明卡片浮在地球上，大号机场代码 + 中间飞行时长 +
              座位/登机时间/场景/距离，底部条码，右侧票根可以按住往右撕开
            · 地球不再是纯色球：内置程序化生成的 1024×512 行星贴图（海面/雨林/温带/荒漠/极冠 + 噪点），
              逐像素球面投影，带昼夜明暗和大气边缘光，还有星空
            · 地图页改成铺开的卫星底图，双指 1x-24x 缩放、单指平移，航线和飞机实时跟随
            · 飞行页左右两列圆钮：暂停 / 静音；通话 / 归位 / 地图 / 缩放
            仍然全程离线、没有网络权限、不要任何 API Key。
          files: focus-flight-v1.3.0-debug.apk
